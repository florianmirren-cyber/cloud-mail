name: Deploy rxkflo mailbox

on:
  push:
    branches: [main]
    paths: ['mail-worker/**', 'mail-vue/**', 'scripts/**', '.github/workflows/deploy-cloudflare.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: rxkflo-mail-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml
      - name: Install Worker dependencies
        run: pnpm --dir mail-worker install --frozen-lockfile
      - name: Test webhook authentication
        run: pnpm --dir mail-worker exec vitest run --config vitest.webhook.config.mjs
      - name: Validate production build
        run: pnpm --dir mail-worker exec wrangler deploy --config wrangler-rxkflo.jsonc --dry-run
      - name: Prepare deployment secrets
        if: github.event_name != 'pull_request'
        env:
          RXKFLO_JWT_SECRET: ${{ secrets.RXKFLO_JWT_SECRET }}
          RXKFLO_RESEND_WEBHOOK_SECRET: ${{ secrets.RXKFLO_RESEND_WEBHOOK_SECRET }}
        run: node scripts/prepare-deploy-secrets.mjs
      - name: Deploy Worker and static assets
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RXKFLO_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.RXKFLO_CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir mail-worker exec wrangler deploy --config wrangler-rxkflo.jsonc --secrets-file ../.secrets/deploy.json
      - name: Initialize or upgrade database
        if: github.event_name != 'pull_request'
        run: node scripts/initialize-mail.mjs
      - name: Remove temporary credentials
        if: always()
        run: rm -f .secrets/deploy.json
